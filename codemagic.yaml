workflows:
  android-workflow:
    name: Ghmdan Direct Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Verify Flutter Project Root
        script: |
          # التأكد من وجود ملف المشروع والتحقق من البيئة
          flutter doctor
      - name: Build Flutter APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: Ghmdan Final Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Get Dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

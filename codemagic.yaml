workflows:
  android-workflow:
    name: Ghmdan Direct Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Flutter APK
        script: |
          # تحديث الحزم وبناء ملف الـ APK مباشرة بدون إنشاء مشروع جديد
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

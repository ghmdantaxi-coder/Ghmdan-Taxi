workflows:
  android-workflow:
    name: Ghmdan Taxi Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Reconstruct Flutter Android Project
        script: |
          mkdir -p temp_app
          cd temp_app
          flutter create . --org com.ghmdan.taxi --project-name ghmdan_taxi
          cp -r ../lib/. ./lib/
          if [ -f ../pubspec.yaml ]; then
            cp ../pubspec.yaml ./pubspec.yaml
          fi
          flutter pub get
          flutter build apk --release
          mkdir -p ../build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../build/app/outputs/flutter-apk/
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: Ghmdan Robust Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Setup and Build APK
        script: |
          # إنشاء مشروع فلاتر نظيف في مجلد مؤقت ونسخ ملفاتك إليه
          flutter create temp_project --org com.ghmdan.taxi --project-name ghmdan_taxi
          rm -rf temp_project/lib
          cp -r lib temp_project/lib
          
          cd temp_project
          
          # تعيين اسم التطبيق بالعربية (غمدان)
          sed -i '' 's/android:label="ghmdan_taxi"/android:label="غمدان"/g' android/app/src/main/AndroidManifest.xml || true
          
          flutter pub get
          flutter build apk --release --tree-shake-icons
          
          # نقل ملف الـ APK الناتج إلى المجلد الرئيسي ليظهر في الـ Artifacts
          mkdir -p ../build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/*.apk ../build/app/outputs/flutter-apk/
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: Ghmdan Direct Optimized Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Optimized APK
        script: |
          # تحديث اسم التطبيق إلى غمدان في ملفات التكوين إن وجدت، أو بناؤه مباشرة
          flutter pub get
          flutter build apk --release --tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

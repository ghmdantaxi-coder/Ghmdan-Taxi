workflows:
  android-workflow:
    name: Android App Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Set up Flutter
        script: |
          cd lib
          flutter pub get
      - name: Build Android APK
        script: |
          cd lib
          flutter build apk --release
    artifacts:
      - lib/build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: Ghmdan Taxi Optimized Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Reconstruct Light Flutter Project
        script: |
          mkdir -p temp_app
          cd temp_app
          flutter create . --org com.ghmdan.taxi --project-name ghmdan_taxi
          cp -r ../lib/. ./lib/
          if [ -f ../pubspec.yaml ]; then
            cp ../pubspec.yaml ./pubspec.yaml
          fi
          # تعيين اسم التطبيق بالعربية (غمدان)
          sed -i '' 's/android:label="ghmdan_taxi"/android:label="غمدان"/g' android/app/src/main/AndroidManifest.xml || true
          
          flutter pub get
          # بناء APK مضغوط ومحسّن لحجم أصغر (Split per ABI / Obfuscate)
          flutter build apk --release --split-per-abi --tree-shake-icons
          
          mkdir -p ../build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/*.apk ../build/app/outputs/flutter-apk/
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
